name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go mod verify
      - run: CGO_ENABLED=1 CC=clang CXX=clang++ go test -tags "fts5 sqlite_omit_load_extension" ./...
      - run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC=clang CXX=clang++ go build -tags "fts5 sqlite_omit_load_extension" -trimpath ./cmd/llm-wiki
