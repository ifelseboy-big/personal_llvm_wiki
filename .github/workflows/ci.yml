name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cc: clang
            cxx: clang++
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make fmt-check schema-check agents-check installer-check mod-verify vet test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build and install smoke
        run: |
          make build
          make install INSTALL_DIR="$RUNNER_TEMP/llm-wiki-bin"
          "$RUNNER_TEMP/llm-wiki-bin/llm-wiki" --version
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - if: runner.os == 'Linux'
        run: make test-race
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
